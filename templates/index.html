<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업자등록번호 휴폐업 조회</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 2rem;
        }

        .result-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .result-item.success {
            border-color: #28a745;
            background: #d4edda;
        }

        .result-item.error {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .result-item.warning {
            border-color: #ffc107;
            background: #fff3cd;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .business-number {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status.active {
            background: #28a745;
            color: white;
        }

        .status.suspended {
            background: #ffc107;
            color: #333;
        }

        .status.closed {
            background: #dc3545;
            color: white;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-label {
            font-weight: 600;
            color: #555;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #ddd;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
            
            .result-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 사업자등록번호 휴폐업 조회</h1>
            <p>사업자의 휴업·폐업 상태를 실시간으로 확인하세요</p>
        </div>

        <form id="businessForm">
            <div class="form-group">
                <label for="apiKey">API 키 *</label>
                <input type="password" id="apiKey" placeholder="공공데이터포털 API 키를 입력하세요" required>
                <small style="color: #666; font-size: 0.9rem;">
                    API 키는 <a href="https://data.go.kr" target="_blank">공공데이터포털</a>에서 발급받을 수 있습니다.
                </small>
            </div>

            <div class="form-group">
                <label for="businessNumbers">사업자등록번호 *</label>
                <textarea id="businessNumbers" 
                         placeholder="사업자등록번호를 입력하세요&#10;여러 개인 경우 줄바꿈 또는 쉼표로 구분&#10;예: 123-45-67890, 9876543210" 
                         required></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="submitBtn">
                    📋 조회하기
                </button>
                <button type="button" class="btn-secondary" onclick="clearForm()">
                    🔄 초기화
                </button>
                <button type="button" class="btn-success" id="exportBtn" onclick="exportResults()" disabled>
                    📁 CSV 내보내기
                </button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>사업자등록번호를 조회하고 있습니다...</p>
        </div>

        <div class="results" id="results">
            <div class="stats" id="stats"></div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        let currentResults = [];

        document.getElementById('businessForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value.trim();
            const businessNumbersText = document.getElementById('businessNumbers').value.trim();
            
            if (!apiKey || !businessNumbersText) {
                alert('API 키와 사업자등록번호를 모두 입력해주세요.');
                return;
            }
            
            // 사업자등록번호 파싱
            const businessNumbers = businessNumbersText
                .split(/[,\n]/)
                .map(num => num.trim().replace(/[^0-9]/g, ''))
                .filter(num => num.length === 10);
            
            if (businessNumbers.length === 0) {
                alert('올바른 사업자등록번호를 입력해주세요.');
                return;
            }
            
            await searchBusinesses(apiKey, businessNumbers);
        });

        async function searchBusinesses(apiKey, businessNumbers) {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const submitBtn = document.getElementById('submitBtn');
            const exportBtn = document.getElementById('exportBtn');
            
            // UI 상태 변경
            loading.style.display = 'block';
            results.style.display = 'none';
            submitBtn.disabled = true;
            exportBtn.disabled = true;
            
            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        business_numbers: businessNumbers
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentResults = data.results;
                    displayResults(data.results);
                    exportBtn.disabled = false;
                } else {
                    throw new Error(data.error || '조회 중 오류가 발생했습니다.');
                }
                
            } catch (error) {
                showError('조회 중 오류가 발생했습니다: ' + error.message);
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            const resultsListDiv = document.getElementById('resultsList');
            
            // 통계 계산
            const stats = {
                total: results.length,
                active: 0,
                suspended: 0,
                closed: 0,
                error: 0
            };
            
            results.forEach(result => {
                if (result.error) {
                    stats.error++;
                } else {
                    const status = result.status;
                    if (status.includes('계속')) stats.active++;
                    else if (status.includes('휴업')) stats.suspended++;
                    else if (status.includes('폐업')) stats.closed++;
                }
            });
            
            // 통계 표시
            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">총 조회</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #28a745">${stats.active}</div>
                    <div class="stat-label">계속사업자</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #ffc107">${stats.suspended}</div>
                    <div class="stat-label">휴업자</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #dc3545">${stats.closed}</div>
                    <div class="stat-label">폐업자</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #6c757d">${stats.error}</div>
                    <div class="stat-label">오류</div>
                </div>
            `;
            
            // 결과 목록 표시
            resultsListDiv.innerHTML = results.map(result => {
                if (result.error) {
                    return `
                        <div class="result-item error">
                            <div class="result-header">
                                <span class="business-number">${result.business_number}</span>
                                <span class="status">오류</span>
                            </div>
                            <p style="color: #721c24; margin-top: 0.5rem;">${result.error}</p>
                        </div>
                    `;
                }
                
                let statusClass = 'active';
                let itemClass = 'success';
                
                if (result.status.includes('휴업')) {
                    statusClass = 'suspended';
                    itemClass = 'warning';
                } else if (result.status.includes('폐업')) {
                    statusClass = 'closed';
                    itemClass = 'error';
                }
                
                return `
                    <div class="result-item ${itemClass}">
                        <div class="result-header">
                            <span class="business-number">${result.business_number}</span>
                            <span class="status ${statusClass}">${result.status}</span>
                        </div>
                        <div class="result-details">
                            <div class="detail-item">
                                <span class="detail-label">상호명:</span>
                                <span>${result.company_name || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">대표자:</span>
                                <span>${result.ceo_name || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">상태변경일:</span>
                                <span>${result.status_date || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">조회시간:</span>
                                <span>${result.query_time}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            resultsDiv.style.display = 'block';
        }

        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="alert alert-error">
                    ${message}
                </div>
            `;
            resultsDiv.style.display = 'block';
        }

        function clearForm() {
            document.getElementById('businessForm').reset();
            document.getElementById('results').style.display = 'none';
            document.getElementById('exportBtn').disabled = true;
            currentResults = [];
        }

        async function exportResults() {
            if (currentResults.length === 0) {
                alert('내보낼 결과가 없습니다.');
                return;
            }
            
            try {
                const response = await fetch('/api/export', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        results: currentResults
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `business_status_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    throw new Error('CSV 내보내기 중 오류가 발생했습니다.');
                }
            } catch (error) {
                alert('CSV 내보내기 중 오류가 발생했습니다: ' + error.message);
            }
        }
        
        // API 키 저장/불러오기 (로컬 스토리지 사용)
        document.addEventListener('DOMContentLoaded', function() {
            const savedApiKey = localStorage.getItem('businessApiKey');
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
            
            document.getElementById('apiKey').addEventListener('blur', function() {
                localStorage.setItem('businessApiKey', this.value);
            });
        });
    </script>
</body>
</html>
